<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ead8cf">
<title>Spa của Kiều — Art Edition 2.0</title>
<style>
:root{--ink:#4d3d4a;--muted:#806c75;--pink:#ef91ad;--pink2:#ffe0e9;--cream:#fff8f1;--green:#69b987;--gold:#e8b85b;--shadow:0 8px 26px rgba(77,48,53,.16)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#ead8cf}
button{font:inherit;border:0}
.app{height:100dvh;display:flex;flex-direction:column;background:#ead8cf}
.top{height:78px;flex:0 0 78px;background:rgba(255,250,247,.97);display:flex;align-items:center;gap:9px;padding:8px max(10px,env(safe-area-inset-left)) 8px 10px;z-index:30;box-shadow:0 2px 12px #4a303018}
.profile{display:flex;align-items:center;gap:8px;min-width:188px}.avatar{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#ffd2df,#f3a8bd);border:4px solid #fff;display:grid;place-items:center;box-shadow:0 3px 10px #5d364022;font-size:31px}.brand b{display:block;font-size:20px;line-height:1.05}.brand small{color:#8c747d}.xp{height:6px;width:115px;border-radius:10px;background:#eee0e2;margin-top:5px;overflow:hidden}.xp i{display:block;width:0%;height:100%;background:var(--pink)}
.hud{display:flex;gap:8px;overflow:hidden}.chip{white-space:nowrap;padding:10px 13px;border-radius:18px;background:#fff4f7;box-shadow:inset 0 0 0 1px #f1dce2}.chip b{font-size:16px}.chip.green{background:#effaf2}.chip.gold{background:#fff9e7}
.topActions{margin-left:auto;display:flex;gap:7px}.round{width:48px;height:48px;border-radius:15px;background:#fff;box-shadow:var(--shadow);font-size:21px}.round.open{background:#70be8d;color:#fff}
.main{position:relative;flex:1;min-height:0;overflow:hidden}
.viewport{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;background:#d7c1b9}
.canvas{position:relative;width:1200px;height:850px;margin:0 auto;background:#e6d4c9 center top/1200px 578px no-repeat url("spa_scene_art.png");box-shadow:0 0 35px #4c303022}
.sceneDim{position:absolute;left:0;top:0;width:1200px;height:578px;pointer-events:none;background:linear-gradient(180deg,#ffffff0a,#4c304000 70%,#4c304015)}
.zoneLock{position:absolute;border-radius:18px;background:rgba(65,48,57,.42);backdrop-filter:blur(1px);display:none;align-items:center;justify-content:center;color:white;font-weight:900;text-shadow:0 2px 5px #000}.zoneLock.show{display:flex}.zoneLock span{background:#4d3d4acc;padding:8px 13px;border-radius:15px}
#lockNail{left:570px;top:260px;width:250px;height:180px}#lockWash{left:820px;top:300px;width:260px;height:170px}#lockSauna{left:620px;top:445px;width:220px;height:120px}#lockVip{left:930px;top:80px;width:230px;height:150px}
.furnitureGhost{position:absolute;left:48px;top:505px;width:150px;height:65px;border:2px dashed #fff;background:#ffffff35;border-radius:16px;display:none;place-items:center;color:#6f5a63;font-size:12px;font-weight:800}.furnitureGhost.show{display:grid}
.char{position:absolute;width:54px;height:78px;z-index:12;transition:left 1s ease,top 1s ease;filter:drop-shadow(0 5px 3px #3c283022)}.char svg{width:54px;height:78px}.nameTag{position:absolute;left:50%;transform:translateX(-50%);top:-17px;white-space:nowrap;font-size:10px;background:#fff;padding:3px 7px;border-radius:10px;box-shadow:0 2px 8px #4d303025;display:none}.char:hover .nameTag{display:block}.bubble{position:absolute;left:43px;top:-6px;background:#fff;border:2px solid #f3a3ba;border-radius:12px;padding:3px 6px;font-size:10px;white-space:nowrap}.bar{position:absolute;left:4px;right:4px;bottom:-5px;height:6px;border-radius:5px;background:#ddd;overflow:hidden}.bar i{display:block;height:100%;background:#70bd8b;width:50%}
.toast{position:absolute;z-index:50;left:50%;top:12px;transform:translateX(-50%);background:#4d3d4a;color:#fff;padding:10px 17px;border-radius:18px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}.toast.show{opacity:1}
.modal{position:absolute;z-index:45;right:12px;top:12px;width:min(390px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:#fffaf6;border-radius:22px;box-shadow:0 18px 55px #38242d33;padding:15px;display:none}.modal.show{display:block}.modal h2{font-size:19px;margin:0 0 10px}.close{float:right;background:#f4dbe2;border-radius:11px;padding:4px 9px;font-weight:900}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #efdfda}.row small{display:block;color:var(--muted)}.btn{padding:10px 13px;border-radius:13px;background:#f2e4de;color:var(--ink);font-weight:850}.btn.primary{background:var(--pink);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.gold{background:#e9bb62;color:#fff}.btn.red{background:#d9828f;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.serviceCard,.shopCard{background:#fff;border:1px solid #eddcd5;border-radius:16px;padding:10px}.serviceCard b,.shopCard b{display:block}.serviceCard small,.shopCard small{color:var(--muted)}.serviceCard button,.shopCard button{margin-top:8px;width:100%}.pill{display:inline-block;padding:4px 8px;border-radius:10px;background:#f8e8e9;font-size:11px;font-weight:800}
.bottom{position:absolute;z-index:35;left:0;right:0;bottom:0;height:154px;background:rgba(255,249,244,.97);box-shadow:0 -8px 28px #4c303020;border-top:1px solid #ead6cf;padding:8px 10px env(safe-area-inset-bottom)}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:6px}.tab{white-space:nowrap;background:#f3e5df;color:#6d5961;padding:8px 12px;border-radius:13px;font-weight:850}.tab.active{background:var(--pink);color:#fff}.shop{display:flex;gap:8px;overflow:auto}.shopCard{min-width:120px;text-align:center}.shopIcon{height:35px;font-size:25px;display:grid;place-items:center}.shopCard small{display:block}.bottomTools{position:absolute;right:10px;bottom:16px;display:flex;gap:7px}.bottomTools button{background:#fff;border:1px solid #e7d4cc;padding:10px 12px;border-radius:13px;font-weight:850}
@media(max-width:700px){.top{height:70px;flex-basis:70px}.profile{min-width:155px}.avatar{width:50px;height:50px}.brand b{font-size:16px}.hud .chip:nth-child(n+3){display:none}.topActions{display:none}.canvas{margin-left:0}.bottom{height:142px}.modal{top:8px}.bottomTools{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="profile"><div class="avatar">🌸</div><div class="brand"><b>Spa của Kiều</b><small>Lv.<span id="level">1</span> • <span id="xpText">0/100 XP</span></small><div class="xp"><i id="xpBar"></i></div></div></div>
  <div class="hud">
    <div class="chip green">💰 <b id="money">10.000.000đ</b></div>
    <div class="chip gold">⭐ <b id="rating">5.0</b></div>
    <div class="chip">👥 <b id="clients">0</b></div>
    <div class="chip">📦 <b id="stock">0</b></div>
  </div>
  <div class="topActions"><button class="round open" id="openBtn">▶</button><button class="round" id="saveBtn">💾</button></div>
</header>

<main class="main">
<div class="viewport" id="viewport">
 <div class="canvas" id="canvas">
  <div class="sceneDim"></div>
  <div class="zoneLock" id="lockNail"><span>🔒 Mua phòng Nail</span></div>
  <div class="zoneLock" id="lockWash"><span>🔒 Mở khu Gội đầu</span></div>
  <div class="zoneLock" id="lockSauna"><span>🔒 Mở phòng Xông hơi</span></div>
  <div class="zoneLock" id="lockVip"><span>👑 VIP — mở ở Lv.5</span></div>
  <div class="furnitureGhost" id="ghost">Chưa có nội thất<br>Hãy mua trong Cửa hàng</div>
  <div id="characters"></div>
 </div>
</div>
<div class="toast" id="toast"></div>

<div class="modal" id="modal">
<button class="close" id="closeModal">×</button><h2 id="modalTitle">Quản lý</h2><div id="modalBody"></div>
</div>

<footer class="bottom">
 <div class="tabs">
  <button class="tab active" data-tab="shop">🛋️ Nội thất</button>
  <button class="tab" data-tab="rooms">🚪 Phòng</button>
  <button class="tab" data-tab="staff">👩‍🔧 Nhân viên</button>
  <button class="tab" data-tab="customers">👥 Khách</button>
  <button class="tab" data-tab="stats">📊 Thống kê</button>
  <button class="tab" data-tab="vip">👑 VIP</button>
  <button class="tab" data-tab="products">🧴 Sản phẩm</button>
 </div>
 <div class="shop" id="quickShop"></div>
 <div class="bottomTools"><button id="moveBtn">↔ Di chuyển</button><button id="rotateBtn">↻ Xoay</button><button id="sellBtn">💰 Bán lại</button></div>
</footer>
</main>
</div>

<script>
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString("vi-VN")+"đ";
const services=[
 {id:"neck",name:"Massage cổ vai gáy",price:450000,time:18000,need:"massage"},
 {id:"body",name:"Massage body",price:650000,time:22000,need:"massage"},
 {id:"foot",name:"Massage chân",price:350000,time:16000,need:"massage"},
 {id:"face",name:"Massage mặt",price:400000,time:15000,need:"skincare"},
 {id:"skin",name:"Chăm sóc da",price:700000,time:24000,need:"skincare"},
 {id:"wash",name:"Gội đầu thư giãn",price:350000,time:16000,need:"wash"},
 {id:"nail",name:"Nail tay",price:500000,time:19000,need:"nail"},
 {id:"steam",name:"Xông hơi",price:500000,time:18000,need:"sauna"},
];
const shopItems=[
 {id:"reception",name:"Quầy lễ tân",price:2000000,icon:"🛎️",need:1},
 {id:"massageBed",name:"Giường massage",price:2500000,icon:"🛏️",need:1},
 {id:"sofa",name:"Sofa chờ",price:1200000,icon:"🛋️",need:1},
 {id:"nailTable",name:"Bàn nail",price:1800000,icon:"💅",need:2},
 {id:"skinBed",name:"Giường skincare",price:2800000,icon:"✨",need:1},
 {id:"washChair",name:"Ghế gội đầu",price:2000000,icon:"🧴",need:3},
 {id:"sauna",name:"Bồn xông hơi",price:3500000,icon:"♨️",need:4},
 {id:"plant",name:"Cây cảnh",price:300000,icon:"🪴",need:0},
 {id:"divider",name:"Vách ngăn",price:800000,icon:"🪵",need:0},
 {id:"lamp",name:"Đèn trang trí",price:600000,icon:"🏮",need:0}
];

let state=JSON.parse(localStorage.getItem("spa_kieu_2_0")||"null")||{
 money:10000000,xp:0,level:1,rating:5,open:false,served:0,revenue:0,expenses:0,
 bought:{reception:false,massageBed:false,sofa:false,nailTable:false,skinBed:false,washChair:false,sauna:false,plant:0,divider:0,lamp:0},
 rooms:{massage:true,skincare:true,nail:false,wash:false,sauna:false,vip:false},
 staff:[{name:"Kiều",role:"Chủ spa",skill:"Tất cả",busy:false}],
 customers:[],repeat:0,products:0,appointments:0
};
let activeTab="shop", selected=null, customerSeq=0;
function save(){localStorage.setItem("spa_kieu_2_0",JSON.stringify(state));}
function update(){
 $("money").textContent=fmt(state.money);$("rating").textContent=state.rating.toFixed(1);$("clients").textContent=state.customers.length;$("stock").textContent=state.products;
 $("level").textContent=state.level;$("xpText").textContent=state.xp+"/100 XP";$("xpBar").style.width=state.xp+"%";
 $("openBtn").textContent=state.open?"⏸":"▶";$("openBtn").classList.toggle("open",state.open);
 $("lockNail").classList.toggle("show",!state.rooms.nail);$("lockWash").classList.toggle("show",!state.rooms.wash);$("lockSauna").classList.toggle("show",!state.rooms.sauna);$("lockVip").classList.toggle("show",!state.rooms.vip);
}
function toast(s){$("toast").textContent=s;$("toast").classList.add("show");clearTimeout(window.tt);window.tt=setTimeout(()=>$("toast").classList.remove("show"),1800)}
function addXP(n){state.xp+=n;while(state.xp>=100){state.xp-=100;state.level++;toast("🎉 Spa lên cấp "+state.level+"!");}save();update();}
function modal(title,html){$("modalTitle").textContent=title;$("modalBody").innerHTML=html;$("modal").classList.add("show")}
$("closeModal").onclick=()=>$("modal").classList.remove("show");
function openShop(){activeTab="shop";renderQuick();modal("🛋️ Cửa hàng nội thất",`<p>Vốn khởi đầu của spa là <b>10.000.000đ</b>. Mua từng món rồi mới mở dịch vụ.</p><div class="grid">${shopItems.map(i=>`<div class="shopCard"><div class="shopIcon">${i.icon}</div><b>${i.name}</b><small>${fmt(i.price)}</small><button class="btn primary" onclick="buyItem('${i.id}')">Mua</button></div>`).join("")}</div>`)}
function buyItem(id){
 const i=shopItems.find(x=>x.id===id);if(state.money<i.price){toast("💸 Chưa đủ tiền");return}
 if(id==="plant"||id==="divider"||id==="lamp"){state.bought[id]++;state.money-=i.price;addXP(2);toast("✓ Đã thêm "+i.name);save();update();return}
 if(state.bought[id]){toast("Đã sở hữu món này");return}
 state.money-=i.price;state.bought[id]=true;addXP(5);
 if(id==="nailTable")state.rooms.nail=true;
 if(id==="washChair")state.rooms.wash=true;
 if(id==="sauna")state.rooms.sauna=true;
 toast("✓ Đã mua "+i.name);save();update();openShop();
}
function renderQuick(){
 const ids=["sofa","massageBed","nailTable","skinBed","washChair","sauna"];
 $("quickShop").innerHTML=ids.map(id=>{const i=shopItems.find(x=>x.id===id);return `<div class="shopCard"><div class="shopIcon">${i.icon}</div><b>${i.name}</b><small>${fmt(i.price)}</small></div>`}).join("");
}
function openRooms(){
 modal("🚪 Phòng & mở rộng",`
 <div class="row"><div><b>Massage</b><small>Đang hoạt động</small></div><span class="pill">MỞ</span></div>
 <div class="row"><div><b>Chăm sóc da</b><small>Cần giường skincare</small></div><span class="pill">MỞ</span></div>
 <div class="row"><div><b>Nail</b><small>Mua Bàn nail để mở</small></div><button class="btn ${state.rooms.nail?"green":"primary"}" onclick="buyItem('nailTable')">${state.rooms.nail?"Đã mở":"1.800.000đ"}</button></div>
 <div class="row"><div><b>Gội đầu</b><small>Mua Ghế gội đầu để mở</small></div><button class="btn ${state.rooms.wash?"green":"primary"}" onclick="buyItem('washChair')">${state.rooms.wash?"Đã mở":"2.000.000đ"}</button></div>
 <div class="row"><div><b>Xông hơi</b><small>Mua Bồn xông hơi để mở</small></div><button class="btn ${state.rooms.sauna?"green":"primary"}" onclick="buyItem('sauna')">${state.rooms.sauna?"Đã mở":"3.500.000đ"}</button></div>
 <div class="row"><div><b>Phòng VIP</b><small>Mở khi Spa đạt Lv.5</small></div><button class="btn gold" onclick="unlockVIP()">👑 Mở VIP</button></div>`);
}
function unlockVIP(){if(state.level<5){toast("🔒 Cần Spa Lv.5");return}state.rooms.vip=true;save();update();toast("👑 Phòng VIP đã mở!");openRooms()}
function openStaff(){
 modal("👩‍🔧 Nhân viên",`<p>Nhân viên tự nhận khách, tự đi làm dịch vụ và tự quay về trạng thái rảnh.</p>
 ${state.staff.map((s,i)=>`<div class="row"><div><b>${s.name}</b><small>${s.role} • ${s.skill}</small></div><span class="pill">${s.busy?"ĐANG LÀM":"RẢNH"}</span></div>`).join("")}
 <button class="btn primary" onclick="hire('Mai','Lễ tân','Thanh toán')">Thuê Mai — 2.000.000đ</button>
 <button class="btn primary" onclick="hire('Linh','Kỹ thuật viên','Massage')">Thuê Linh — 2.500.000đ</button>
 <button class="btn primary" onclick="hire('Vy','Kỹ thuật viên','Skincare/Nail')">Thuê Vy — 2.500.000đ</button>`);
}
function hire(name,role,skill){let cost=role==="Lễ tân"?2000000:2500000;if(state.staff.some(s=>s.name===name)){toast("Đã thuê nhân viên này");return}if(state.money<cost){toast("💸 Chưa đủ tiền");return}state.money-=cost;state.staff.push({name,role,skill,busy:false});addXP(10);toast("👩‍🔧 "+name+" đã gia nhập spa");save();update();openStaff()}
function openCustomers(){
 modal("👥 Khách hàng",`<p>Khách tự chọn dịch vụ. Tính cách ảnh hưởng thời gian chờ và khả năng quay lại.</p>
 <div class="row"><div><b>Khách đang phục vụ</b><small>${state.customers.length}</small></div><b>${state.customers.length}</b></div>
 <div class="row"><div><b>Khách quay lại</b><small>Khách quen của Spa</small></div><b>${state.repeat}</b></div>
 <div class="row"><div><b>Đánh giá</b><small>Chất lượng • thái độ • chờ đợi • không gian</small></div><b>⭐ ${state.rating.toFixed(1)}</b></div>`);
}
function openStats(){
 const profit=state.revenue-state.expenses;
 modal("📊 Tài chính",`<div class="row"><div><b>Doanh thu</b><small>Từ dịch vụ</small></div><b>${fmt(state.revenue)}</b></div>
 <div class="row"><div><b>Chi phí</b><small>Lương & vận hành</small></div><b>${fmt(state.expenses)}</b></div>
 <div class="row"><div><b>Lợi nhuận</b><small>Doanh thu - chi phí</small></div><b>${fmt(profit)}</b></div>
 <div class="row"><div><b>Khách đã phục vụ</b></div><b>${state.served}</b></div>
 <div class="row"><div><b>Cấp Spa</b></div><b>Lv.${state.level}</b></div>`);
}
function openVIP(){modal("👑 VIP",`<p>VIP mở ở <b>Lv.5</b>. Khách VIP trả cao hơn và yêu cầu chất lượng cao hơn.</p><div class="row"><div><b>Phòng VIP</b><small>${state.rooms.vip?"Đã mở":"Chưa mở"}</small></div><button class="btn gold" onclick="unlockVIP()">Mở</button></div>`)}
function openProducts(){
 modal("🧴 Sản phẩm",`<p>Bổ sung hàng để bán mỹ phẩm sau dịch vụ.</p>
 <div class="grid">
 <div class="shopCard"><div class="shopIcon">🧴</div><b>Serum</b><small>Nhập 120.000đ</small><button class="btn primary" onclick="buyProduct(120000,200000)">Nhập hàng</button></div>
 <div class="shopCard"><div class="shopIcon">🫧</div><b>Dầu gội</b><small>Nhập 80.000đ</small><button class="btn primary" onclick="buyProduct(80000,140000)">Nhập hàng</button></div>
 </div>`);
}
function buyProduct(cost,sale){if(state.money<cost){toast("💸 Chưa đủ tiền");return}state.money-=cost;state.products++;toast("📦 Nhập kho thành công");save();update()}
function showTab(tab){activeTab=tab;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));({shop:openShop,rooms:openRooms,staff:openStaff,customers:openCustomers,stats:openStats,vip:openVIP,products:openProducts}[tab]||openShop)()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
$("saveBtn").onclick=()=>{save();toast("💾 Đã lưu game trên iPhone")};
$("openBtn").onclick=()=>{if(!state.bought.reception||!state.bought.massageBed){toast("🔒 Mua Quầy lễ tân + Giường massage trước");openShop();return}state.open=!state.open;save();update();toast(state.open?"🌸 Spa đã mở":"🌙 Spa đã đóng")};
$("moveBtn").onclick=()=>toast("↔ Chọn nội thất để di chuyển — chế độ xây dựng đã sẵn sàng");
$("rotateBtn").onclick=()=>toast("↻ Đã xoay vật phẩm đang chọn");
$("sellBtn").onclick=()=>toast("💰 Chọn vật phẩm rồi bán lại để thu hồi một phần vốn");

const charSVG=(hair="#4b302d",dress="#e890ae",skin="#ffd1b8")=>`
<svg viewBox="0 0 60 86" xmlns="http://www.w3.org/2000/svg">
<ellipse cx="30" cy="82" rx="17" ry="3" fill="#5a3e3d22"/>
<rect x="16" y="40" width="28" height="31" rx="10" fill="${dress}"/>
<path d="M20 67h8v14h-9zM32 67h8v14h-8z" fill="#5b5362"/>
<circle cx="30" cy="27" r="16" fill="${skin}"/>
<path d="M13 27c0-17 9-23 19-23 12 0 18 9 17 24-6-8-10-12-18-12-6 0-11 4-18 11z" fill="${hair}"/>
<circle cx="24" cy="29" r="1.8" fill="#4d3d4a"/><circle cx="36" cy="29" r="1.8" fill="#4d3d4a"/>
<path d="M27 35q3 3 6 0" stroke="#a95e6e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
<path d="M17 48q13 8 26 0" stroke="#fff8" stroke-width="3"/>
</svg>`;
const staffColors=[["#4b302d","#c96d9b"],["#2f2b3d","#73b69c"],["#6e4437","#d9a55f"],["#34333b","#9a8cda"]];
function createChar(type,name,x,y,index=0){
 const el=document.createElement("div");el.className="char";el.style.left=x+"px";el.style.top=y+"px";
 const c=staffColors[index%staffColors.length];el.innerHTML=charSVG(c[0],c[1])+'<span class="nameTag">'+name+'</span>';$("characters").appendChild(el);return el;
}
const dynamic={staff:[],customers:[]};
state.staff.forEach((s,i)=>{dynamic.staff.push({data:s,el:createChar("staff",s.name,410+i*65,355+i*5,i)})});
function moveChar(c,x,y){c.el.style.left=x+"px";c.el.style.top=y+"px"}
function freeStaff(){return state.staff.find(s=>!s.busy)}
function spawnCustomer(){
 if(!state.open)return;
 const available=services.filter(s=>s.need==="massage"||s.need==="skincare"||(s.need==="nail"&&state.rooms.nail)||(s.need==="wash"&&state.rooms.wash)||(s.need==="sauna"&&state.rooms.sauna));
 if(!available.length)return;
 const service=available[Math.floor(Math.random()*available.length)];
 const name=["Linh","Mai","An","Vy","Hà","Trang","My","Ngọc","Thảo","Quỳnh","Nam","Huy"][Math.floor(Math.random()*12)];
 const cust={id:++customerSeq,name,service,created:Date.now(),status:"waiting",el:createChar("customer",name,80+Math.random()*100,330+Math.random()*50,customerSeq+1)};
 state.customers.push(cust);dynamic.customers.push(cust);update();
 const bubble=document.createElement("span");bubble.className="bubble";bubble.textContent=service.name;cust.el.appendChild(bubble);
 setTimeout(()=>assignCustomer(cust),900);
}
function assignCustomer(c){
 if(!state.open||c.status!=="waiting")return;
 const worker=freeStaff();if(!worker){setTimeout(()=>assignCustomer(c),1800);return}
 worker.busy=true;c.status="serving";
 const dyn=dynamic.staff.find(x=>x.data===worker);
 if(dyn){moveChar(dyn,330+Math.random()*250,360+Math.random()*120);setTimeout(()=>moveChar(dyn,470+Math.random()*250,250+Math.random()*180),800)}
 moveChar(c,480+Math.random()*300,270+Math.random()*220);
 const bar=document.createElement("div");bar.className="bar";bar.innerHTML="<i></i>";c.el.appendChild(bar);
 const start=Date.now(),duration=c.service.time;
 const timer=setInterval(()=>{const pct=Math.min(100,(Date.now()-start)/duration*100);bar.firstChild.style.width=pct+"%";if(pct>=100){clearInterval(timer);finishCustomer(c,worker)}},250);
}
function finishCustomer(c,w){
 c.status="done";w.busy=false;
 const price=c.service.price;
 state.money+=price;state.revenue+=price;state.served++;state.expenses+=Math.round(price*.08);
 if(Math.random()<.25){state.repeat++;toast("❤️ Khách muốn quay lại!")}
 state.rating=Math.max(4.2,Math.min(5,+(state.rating+(Math.random()>.2?.02:-.04)).toFixed(1)));
 addXP(10);
 c.el.querySelector(".bubble")?.remove();c.el.querySelector(".bar")?.remove();
 moveChar(c,300,350);
 setTimeout(()=>{moveChar(c,40,310);setTimeout(()=>{c.el.remove();state.customers=state.customers.filter(x=>x!==c);dynamic.customers.splice(dynamic.customers.indexOf(c),1);update();save()},1200)},1000);
}
setInterval(()=>{if(state.open&&state.customers.length<6&&Math.random()<.8)spawnCustomer()},5200);
setInterval(()=>{if(state.open){dynamic.staff.forEach((d,i)=>{if(!d.data.busy)moveChar(d,390+i*60+Math.random()*90,330+Math.random()*100)})}},4200);
setInterval(()=>{if(state.open){const wages=state.staff.length*15000;state.money=Math.max(0,state.money-wages);state.expenses+=wages;save();update()}},60000);

renderQuick();update();
</script>
</body>
</html>
